<app-header></app-header>

<main class="main-content" id="main-content">
  <div class="content-container">

    <!-- Hero Section -->
    <section class="hero-section" aria-labelledby="hero-title">
      <div class="hero-badge-wrapper">
        <span class="institutional-badge">
          <span class="badge-icon" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M7 1L8.5 5.5H13L9.5 8L11 12.5L7 10L3 12.5L4.5 8L1 5.5H5.5L7 1Z" fill="#C5A880" />
            </svg>
          </span>
          <span>بوابة الخطط التعليمية</span>
        </span>
      </div>

      <h2 class="hero-title" id="hero-title">الخطة الأسبوعية</h2>

      <p class="hero-subtitle">
        عرض ومتابعة الخطط الأسبوعية للمرحلة الثانوية
      </p>
    </section>

    <!-- Central Selection Panel -->
    <section class="selection-card-wrapper" aria-label="لوحة تحديد الخطة الأسبوعية">
      <div class="selection-card">
        <!-- Card Header Decor Strip -->
        <div class="card-accent-bar" aria-hidden="true"></div>

        <form class="selection-form">

          <div class="form-grid">
            <!-- Field 1: Grade Selection -->
            <div class="form-group">
              <label for="grade-select" class="form-label">
                <span class="label-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                  </svg>
                </span>
                <span class="label-text">اختر الصف الدراسي</span>
              </label>

              <div class="select-wrapper">
                <select id="grade-select" name="grade" class="custom-select" [(ngModel)]="grade">
                  <option value="" disabled selected>اختر الصف الدراسي</option>
                  <option value="first">الأول الثانوي</option>
                  <option value="second">الثاني الثانوي</option>
                  <option value="third">الثالث الثانوي</option>
                </select>

                <div class="select-arrow" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>
            </div>

            <!-- Field 2: Week Selection -->
            <div class="form-group">
              <label for="week-select" class="form-label">
                <span class="label-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                  </svg>
                </span>
                <span class="label-text">اختر الأسبوع</span>
              </label>

              <div class="select-wrapper">
                <select id="week-select" name="week" class="custom-select" [(ngModel)]="week">
                  <option value="" disabled selected>اختر الأسبوع</option>
                  <option value="1">الأسبوع الأول</option>
                  <option value="2">الأسبوع الثاني</option>
                  <option value="3">الأسبوع الثالث</option>
                  <option value="4">الأسبوع الرابع</option>
                  <option value="5">الأسبوع الخامس</option>
                  <option value="6">الأسبوع السادس</option>
                  <option value="7">الأسبوع السابع</option>
                  <option value="8">الأسبوع الثامن</option>
                  <option value="9">الأسبوع التاسع</option>
                  <option value="10">الأسبوع العاشر</option>
                  <option value="11">الأسبوع الحادي عشر</option>
                  <option value="12">الأسبوع الثاني عشر</option>
                  <option value="13">الأسبوع الثالث عشر</option>
                  <option value="14">الأسبوع الرابع عشر</option>
                  <option value="15">الأسبوع الخامس عشر</option>
                  <option value="16">الأسبوع السادس عشر</option>
                  <option value="17">الأسبوع السابع عشر</option>
                  <option value="18">الأسبوع الثامن عشر</option>
                </select>

                <div class="select-arrow" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </div>
              </div>
            </div>
          </div>

          <!-- Action Area: Primary Button (Visual Only) -->
          <div class="form-actions">
            <button type="button" class="btn-primary-submit" id="view-plan-button"
              (click)="onClickViewPlan(grade, week)">
              <span class="btn-content">
                <span class="btn-label">عرض الخطة</span>
                <span class="btn-arrow" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                  </svg>
                </span>
              </span>
              <span class="btn-glow" aria-hidden="true"></span>
            </button>
          </div>

        </form>
      </div>

      <!-- Institutional Trust Badges (Refined, minimal) -->
      <div class="trust-features" aria-label="مميزات النظام التعليمي">
        <div class="feature-item">
          <span class="feature-bullet" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <span>جدول أسبوعي شامل (الأحد - الخميس)</span>
        </div>

        <div class="feature-separator" aria-hidden="true">•</div>

        <div class="feature-item">
          <span class="feature-bullet" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
          </span>
          <span>تنسيق رسمي مهيأ للطباعة والمشاركة</span>
        </div>
      </div>

    </section>

  </div>
</main>
